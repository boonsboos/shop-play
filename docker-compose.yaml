services:
  # database
  mariadb:
    image: "mariadb:latest"
    ports:
      - "3306:3306"
    environment:
      MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: "1"
      MARIADB_ROOT_PASSWORD: "" # voor lokaal gebruik zetten we het root wachtwoord op leeg

  phpmyadmin:
    image: "phpmyadmin"
    ports:
      - "8081:80" # phpMyAdmin is lokaal toegankelijk vanaf poort 8081
    depends_on:
      - mariadb
    environment:
      PMA_HOST: mariadb # dit geeft aan dat dit de container is waarop de database runt.

  # host onze afbeeldingen
  image-server:
    image: "image-server"
    build:
      dockerfile: resources/go-fast-cdn.Dockerfile
      tags:
        - "image-server"
    ports:
      - "8082:8080"